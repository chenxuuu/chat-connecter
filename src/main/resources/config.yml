# MC-QQ-Bridge 配置文件

# TCP 连接配置
tcp:
  # QQ机器人的TCP服务器地址
  host: "127.0.0.1"
  # QQ机器人的TCP服务器端口
  port: 23333
  # 自动重连间隔（秒）
  reconnect-interval: 5
  # 是否启用自动重连
  auto-reconnect: true

# 消息配置
message:
  # QQ消息转发到游戏内的格式
  # 变量: {sender} - 发送者名称, {message} - 消息内容
  qq-to-mc-format: "§b[QQ] §f{sender}§7: §r{message}"
  
  # 游戏内消息转发到QQ的格式
  # 变量: {player} - 玩家名称, {message} - 消息内容
  mc-to-qq-format: "{player}: {message}"
  
  # 玩家上线消息（发送到QQ）
  player-join-format: "{player} 加入了服务器"
  
  # 玩家下线消息（发送到QQ）
  player-quit-format: "{player} 离开了服务器"

# 功能开关
features:
  # 是否转发玩家聊天消息到QQ
  forward-chat: true
  # 是否转发玩家上下线消息到QQ
  forward-join-quit: true
  # 是否转发QQ消息到游戏内
  forward-qq-to-mc: true
  # 是否允许远程命令执行
  allow-remote-command: true
  # 是否在服务器启动时发送通知
  send-server-start: true

# 日志配置
logging:
  # 是否在控制台显示详细日志
  verbose: false
